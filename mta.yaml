_schema-version: "3.2"
ID: business-partner-ai
version: 1.0.0
description: "Business Partner AI – LangGraph flow for Personal ID verification"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx --yes cds build --production

modules:
  # ---------- CAP service (Node.js, stateless – no database) ----------
  - name: business-partner-ai-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: business-partner-ai-auth
      - name: business-partner-ai-destination
      - name: business-partner-ai-connectivity

  # ---------- App router (serves the Fiori UI + auth) ----------
  - name: business-partner-ai-approuter
    type: approuter.nodejs
    path: app
    parameters:
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
      ignore:
        - ".env"
        - "default-env.json"
    requires:
      - name: business-partner-ai-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: business-partner-ai-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: business-partner-ai-${org}-${space}
        tenant-mode: dedicated

  - name: business-partner-ai-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: business-partner-ai-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  # The OpenAI API key is NOT in this file and NOT a service binding.
  # Store it in a BTP Destination named "OPENAI" (subaccount -> Connectivity -> Destinations):
  #   Type=HTTP  URL=https://api.openai.com/v1  ProxyType=Internet
  #   Authentication=BasicAuthentication  User=apikey  Password=<the key>   (Password is masked)
  #   Additional property (optional):  OpenAI.Model = gpt-4o-mini
  # The srv reads it via the already-bound destination service (see srv/lib/graph.js).
